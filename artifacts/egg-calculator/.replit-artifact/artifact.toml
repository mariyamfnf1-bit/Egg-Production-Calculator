kind = "mobile"
previewPath = "/"
title = "Egg Production Calculator"
version = "1.0.0"
id = "artifacts/egg-calculator"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 22682

[services.development]
run = "pnpm --filter @workspace/egg-calculator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/egg-calculator", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/egg-calculator", "run", "serve" ]

[services.env]
PORT = "22682"
BASE_PATH = "/"
